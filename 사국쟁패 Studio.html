'use strict';

// src/model/world.js
const SCHEMA_VERSION = 1;
const PERSONALITIES = { balanced: '균형형', peaceful: '내정형', aggressive: '호전형' };
const ROLES = { king: '국왕', minister: '승상', general: '장군' };
const DEFAULT_RULES = Object.freeze({
  diceSides: 10, domesticThresholds: { balanced: 5, peaceful: 7, aggressive: 3 },
  successTarget: 6, recruitGain: 3, productionGain: 3, territoryProduction: 1,
  armyAdvantageBonus: 1, lossRates: { win: 0.3, tie: 0.4, loss: 0.5 }, roundLimit: 30,

const clone = value => structuredClone(value);
const newId = prefix => `${prefix}-${globalThis.crypto.randomUUID()}`;
const landCount = (world, id) => world.territories.filter(t => t.ownerId === id).length;
const findCountry = (world, id) => world.countries.find(c => c.id === id);
const countryPeople = (world, id) => world.people.filter(p => p.countryId === id);
const totalTroops = world => world.countries.reduce((sum, c) => sum + c.troops, 0);

    recruitGain: number(r.recruitGain, '모병 성공 병력', 0, 10000), productionGain: number(r.productionGain, '충원 강화 증가량', 0, 10000),

    lossRates: Object.fromEntries(['win', 'tie', 'loss'].map(k => [k, number(losses[k], '손실률', 0, 1, false)])), roundLimit: number(r.roundLimit, '제한 라운드', 1, 1000),

}

// A reproducible generator. UI animations must never use this generator.
function seedNumber(seed) {
  const value = String(seed);
  let hash = 2166136261;
  for (const char of value) hash = Math.imul(hash ^ char.charCodeAt(0), 16777619) >>> 0;
  return hash;
}
function randomInt(state, max) {
  if (!Number.isInteger(max) || max < 1) throw new Error('추첨 후보가 없습니다.');
  state.rng = (Math.imul(state.rng, 1664525) + 1013904223) >>> 0;
  return Math.floor((state.rng / 4294967296) * max);
}
const roll = (state, sides) => 1 + randomInt(state, sides);

const ENGINE_VERSION = 'studio-0.1';
const livingCountries = world => world.countries.filter(c => landCount(world, c.id) > 0);
function createRun(definition, seed = '20261017') {
  const world = validateWorld(definition);
  if (livingCountries(world).length < 2) throw new Error('영토를 가진 국가가 2개 이상 필요합니다. 지도에서 국가별 영토를 지정해 주세요.');
  const initialWorld = clone(world);
  for (const country of world.countries) if (!landCount(world, country.id)) country.troops = 0;
  return { engineVersion: ENGINE_VERSION, seed: String(seed), rng: seedNumber(seed), world, initialWorld, round: 1, turn: 0, schedule: livingCountries(world).map(c => c.id), scheduleIndex: 0, history: [], result: null };
}
function currentActor(run) {
  if (run.result) return null;
  return run.world.countries.find(c => c.id === run.schedule[run.scheduleIndex]) || null;
}
function casualty(own, enemy, rate) {
  if (!own || !enemy || rate === 0) return 0;
  return Math.min(own, Math.max(1, Math.round(own * rate * (2 * enemy) / (own + enemy))));
}
function finish(run, reason) {
  let winners = livingCountries(run.world);
  if (reason === 'limit') {
    const mostLand = Math.max(...winners.map(c => landCount(run.world, c.id)));
    winners = winners.filter(c => landCount(run.world, c.id) === mostLand);
    const mostTroops = Math.max(...winners.map(c => c.troops));
    winners = winners.filter(c => c.troops === mostTroops);
  }
  run.result = { reason, winnerIds: winners.map(c => c.id), round: run.round, turn: run.turn };
}
function role(world, id, name) { return countryPeople(world, id).find(p => p.role === name); }
function general(world, id) {

  return countryPeople(world, id).filter(p => p.role === 'general').reduce((best, p) => !best || p.ability > best.ability ? p : best, null);
}

  return world.territories.filter(t => t.ownerId !== countryId && neighbors(world, t).some(n => own.has(n.id)));
}

  const world = run.world, rules = world.rules, actor = currentActor(run);
  if (!actor) throw new Error('행동할 국가를 찾을 수 없습니다. 새 실행을 시작해 주세요.');
  const record = { turn: ++run.turn, round: run.round, actorId: actor.id, actorName: actor.name, color: actor.color, type: 'domestic', title: '', detail: '', rolls: [], changes: [], production: [], eliminatedIds: [] };
  const die = label => { const value = roll(run, rules.diceSides); record.rolls.push({ label, value, sides: rules.diceSides }); return value; };
  const king = role(world, actor.id, 'king'), personality = king?.personality || actor.personality;
  const actionDie = die(king ? `${king.name} · 행동` : '국가 행동');
  const targets = actor.troops > 0 ? borderTargets(world, actor.id) : [];
  const domestic = actionDie <= rules.domesticThresholds[personality] || !targets.length;
  if (domestic) {
    const minister = role(world, actor.id, 'minister'), action = randomInt(run, 2) === 0 ? 'recruit' : 'production';
    const value = die(minister ? `${minister.name} · 내정` : '내정 실행'), ability = minister?.ability || 0, score = value + ability;
    const success = score >= rules.successTarget;
    const actionName = action === 'recruit' ? '모병' : '충원 강화';
    record.title = `${actor.name}, ${actionName} ${success ? '성공' : '실패'}`;
    record.detail = `${value} ${ability < 0 ? '−' : '+'} ${Math.abs(ability)} = ${score}점 · ${rules.successTarget}점 이상 성공.`;
    if (!targets.length && actionDie > rules.domesticThresholds[personality]) record.detail += ' 공격할 수 없어 내정으로 전환했습니다.';
    if (success) {

      else { actor.recruitment += rules.productionGain; record.detail += ` 라운드당 추가 충원 +${rules.productionGain}만.`; }
    }
    record.action = action; record.success = success;
  } else {
    const target = targets[randomInt(run, targets.length)], defender = world.countries.find(c => c.id === target.ownerId);
    record.type = 'war'; record.targetId = target.id; record.targetName = target.name; record.defenderId = defender?.id || null;
    const attackBefore = actor.troops, defenseBefore = defender?.troops || 0;
    let won = true, tied = false;
    if (defender && defenseBefore > 0) {
      const attackerGeneral = general(world, actor.id), defenderGeneral = general(world, defender.id);
      const attackRaw = die(attackerGeneral ? `${attackerGeneral.name} · 공격` : '공격');
      const defenseRaw = die(defenderGeneral ? `${defenderGeneral.name} · 방어` : '방어');
      const attackBonus = (attackerGeneral?.ability || 0) + (attackBefore > defenseBefore ? rules.armyAdvantageBonus : 0);
      const defenseBonus = (defenderGeneral?.ability || 0) + (defenseBefore > attackBefore ? rules.armyAdvantageBonus : 0);
      const attackScore = attackRaw + attackBonus, defenseScore = defenseRaw + defenseBonus;
      won = attackScore > defenseScore; tied = attackScore === defenseScore;
      const attackLoss = casualty(attackBefore, defenseBefore, rules.lossRates[won ? 'win' : tied ? 'tie' : 'loss']);
      const defenseLoss = casualty(defenseBefore, attackBefore, rules.lossRates[won ? 'loss' : tied ? 'tie' : 'win']);
      actor.troops -= attackLoss; defender.troops -= defenseLoss;
      record.battle = { attackRaw, defenseRaw, attackBonus, defenseBonus, attackScore, defenseScore, attackBefore, defenseBefore, attackLoss, defenseLoss };
      record.detail = `공격 ${attackScore}점 (${attackRaw}${attackBonus < 0 ? '' : '+'}${attackBonus}) · 방어 ${defenseScore}점 (${defenseRaw}${defenseBonus < 0 ? '' : '+'}${defenseBonus}). 병력 손실: ${actor.name} ${attackLoss}만 / ${defender.name} ${defenseLoss}만.`;
    } else {
      record.detail = defender ? '상대 국가의 병력이 없어 전투 없이 점령했습니다.' : '인접한 무주지를 전투 없이 편입했습니다.';
    }
    if (won) {
      const before = target.ownerId; target.ownerId = actor.id;
      record.changes.push({ territoryId: target.id, name: target.name, from: before, to: actor.id });
      record.title = `${actor.name}, ${target.name} ${defender ? '점령' : '편입'}`;
      if (defender && landCount(world, defender.id) === 0) {

  run.history.push(record);

}

const STORAGE_KEY = 'saguk-studio.world.v1';
const serializeWorld = world => JSON.stringify({ kind: 'saguk-studio-world', version: 1, world: validateWorld(world) }, null, 2);
function parseWorld(text) {
  if (typeof text !== 'string' || text.length > 5 * 1024 * 1024) throw new Error('세계 파일은 5MB 이하의 JSON이어야 합니다.');
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('JSON 파일을 읽을 수 없습니다. 내보낸 세계 파일을 선택해 주세요.'); }
  if (data?.kind !== 'saguk-studio-world' || data.version !== 1) throw new Error('Studio v0.1에서 내보낸 세계 JSON 파일이 아닙니다. 기존 HTML은 직접 가져올 수 없습니다.');
  return validateWorld(data.world);
}
function saveWorld(storage, world) {
  try { storage.setItem(STORAGE_KEY, serializeWorld(world)); }
  catch (error) { throw new Error(`브라우저 저장에 실패했습니다. JSON 파일로 내보내 주세요. (${error.name})`); }
}
function loadWorld(storage) {
  const text = storage.getItem(STORAGE_KEY);

}

oter"><span>설정 변경은 새 실행부터 반영됩니다.</span><button type="submit" class="button primary">${icon('check', 16)}규칙 변경 저장</button></div></form>`;

function empty(glyph, title, description, action, label) { return `<div class="panel empty"><span class="empty-icon">${icon(glyph, 32)}</span><h2>${title}</h2><p>${description}</p>${button(action, label, 'plus', 'primary')}</div>`; }

function ensureRun() { if (!run) run = createRun(world, ui.seed.trim() || '20261017'); }
function step() { ensureRun(); run = nextTurn(run); if (run.result) stop(); }
function startAuto() {
  ensureRun();
  const tick = () => {
    try { step(); if (!run.result) timer = setTimeout(tick, 1400 / ui.speed); else timer = null; render(); }
    catch (error) { stop(); render(); notify(error.message, true); }
  };
  timer = setTimeout(tick, 1400 / ui.speed); render();
}

  stop(); render();
  openDialog('새 역사 실행', '진행 중인 역사는 교체됩니다. 필요하면 먼저 기록을 내보내 주세요.', `<label>역사 시드<input name="seed" required maxlength="64" value="${esc(ui.seed)}"></label><div class="field-help">같은 세계와 설정, 같은 시드로 실행하면 같은 결과가 나옵니다. 다른 역사를 만들려면 시드를 바꿔 주세요.</div>`, '새 실행 준비');
  dialogHandler = data => { const seed = data.get('seed').trim(); const next = createRun(world, seed); run = next; ui.seed = seed; render(); notify('현재 편집한 세계로 새 실행을 준비했습니다.'); };
}

};
document.addEventListener('click', event => {
  const page = event.target.closest('[data-page]');
  if (page) { event.preventDefault(); navigate(page.dataset.page); return; }
  const action = event.target.closest('[data-action]');
  if (action) { if (action.disabled) return; try { actions[action.dataset.action]?.(action.dataset.id); } catch (error) { notify(error.message, true); } return; }
  const tile = event.target.closest('[data-territory]');
  if (tile) {
    if (tile.dataset.observe) { const t = run?.world.territories.find(t => t.id === tile.dataset.territory); const c = findCountry(run?.world || world, t?.ownerId); notify(`${t?.name} · ${c?.name || '무주지'}`); return; }
    ui.selected = tile.dataset.territory;
    if (ui.page === 'map' && ui.paint) { const next = clone(world); next.territories.find(t => t.id === ui.selected).ownerId = ui.brush || null; updateWorld(next); }
    else render();
  }
});
document.addEventListener('submit', event => {
  event.preventDefault();
  const form = event.target, data = new FormData(form);
  try {
    if (form.id === 'dialog-form') { dialogHandler?.(data); $('#editor-dialog').close(); dialogHandler = null; }
    else if (form.id === 'territory-form') {
      const next = clone(world), t = next.territories.find(t => t.id === ui.selected);
      if (!t) throw new Error('수정할 영토를 선택해 주세요.');
      t.name = data.get('name'); t.ownerId = data.get('ownerId') || null; updateWorld(next); notify('영토 정보를 저장했습니다.');
    } else if (form.id === 'rules-form') {
      const next = clone(world), r = next.rules;
      for (const k of ['diceSides', 'successTarget', 'recruitGain', 'productionGain', 'territoryProduction', 'armyAdvantageBonus', 'roundLimit']) r[k] = Number(data.get(k));
      for (const k of Object.keys(PERSONALITIES)) r.domesticThresholds[k] = Number(data.get(`threshold-${k}`));
      for (const k of ['win', 'tie', 'loss']) r.lossRates[k] = Number(data.get(`loss-${k}`)) / 100;
      updateWorld(next); notify('규칙을 저장했습니다. 새 실행부터 적용됩니다.');
    }
  } catch (error) {
    if (form.id === 'dialog-form') { $('#dialog-error').hidden = false; $('#dialog-error').textContent = error.message; }
    else notify(error.message, true);
  }
});
document.addEventListener('change', async event => {
  const target = event.target;
  if (target.id === 'world-file') {
    const file = target.files?.[0]; target.value = '';
    if (!file) return;
    try {
      if (file.size > 5 * 1024 * 1024) throw new Error('세계 파일은 5MB 이하여야 합니다.');
      const next = parseWorld(await file.text());
      if (confirm(`‘${next.name}’ 세계를 불러올까요? 현재 세계와 실행 기록이 교체됩니다. 보관하려면 취소하고 먼저 파일로 내보내 주세요.`)) { setNewWorld(next); notify('세계의 국가·인물·영토·규칙을 모두 불러왔습니다.'); }
    } catch (error) { notify(error.message, true); }
  } else if (target.id === 'show-names') { ui.showNames = target.checked; render(); }
  else if (target.id === 'paint-owner') ui.brush = target.value;
  else if (target.id === 'person-country-filter') { ui.countryFilter = target.value; render(); }
  else if (target.id === 'person-role-filter') { ui.roleFilter = target.value; render(); }
  else if (target.id === 'sim-speed') { const wasRunning = !!timer; stop(); ui.speed = Number(target.value); if (wasRunning) startAuto(); else render(); }
  else if (target.id === 'sim-seed') ui.seed = target.value;
});
document.addEventListener('input', event => {
  if (event.target.id === 'sim-seed') ui.seed = event.target.value;
  if (event.target.id === 'person-search') {
    const start = event.target.selectionStart, end = event.target.selectionEnd;
    ui.search = event.target.value; render(); const field = $('#person-search'); field.focus(); field.setSelectionRange(start, end);
  }
  if (event.target.name === 'color') event.target.nextElementSibling.textContent = event.target.value.toUpperCase();
  if (event.target.name === 'diceSides' && event.target.closest('#rules-form')) {
    const sides = Number(event.target.value);
    if (sides >= 2 && sides <= 100) {
      for (const field of document.querySelectorAll('[name^="threshold-"]')) field.max = sides;
      document.querySelector('[name="successTarget"]').max = sides + 5;
    }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && timer) { stop(); render(); } });
document.addEventListener('keydown', event => { if (event.key === 'Escape' && ui.recording) { ui.recording = false; render(); } });
window.addEventListener('beforeunload', event => { if (run?.history.length) { event.preventDefault(); event.returnValue = ''; } });
$('#editor-dialog').addEventListener('click', event => { if (event.target === $('#editor-dialog')) { $('#editor-dialog').close(); dialogHandler = null; } });
if (!initialError) persist();
render();
if (initialError) notify(initialError, true);

})();</script>
</body>
</html>
