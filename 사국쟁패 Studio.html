.portrait-options{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}

.portrait-options label:has(input:checked){border-color:var(--gold);box-shadow:0 0 10px #dfbb7944}
.portrait-options input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.portrait-options input:focus-visible+img{outline:2px solid var(--gold);outline-offset:-4px}
.portrait-options img{width:100%;height:66px;object-fit:cover;object-position:center 20%;display:block}
.map-view-select{display:flex;align-items:center;gap:7px;color:#9da994;font-size:9px;white-space:nowrap}
.map-view-select select{font-size:10px;width:80px;padding:5px 7px}
.atlas-scroll{overflow:auto;background:#81a5ab;scrollbar-width:thin;scrollbar-color:#526f7d #9bb8b8}
.atlas-map{display:block;width:100%;height:auto;min-width:620px;aspect-ratio:1.5}
.atlas-map .territory{display:block;background:none;border:0;border-radius:0;outline:0;fill:var(--nation);fill-opacity:.55;stroke:#f2e7c6;stroke-opacity:.75;stroke-width:1;transition:fill .5s,fill-opacity .25s,stroke .25s;box-shadow:none;transform:none;cursor:pointer}
.atlas-cell:hover .territory{fill-opacity:.85;stroke:#fff4ce;stroke-width:3}
.atlas-cell:focus-visible{outline:none}
.atlas-cell:focus-visible .territory,.atlas-map .territory.selected{stroke:#fff7c8;stroke-width:4;fill-opacity:.9;filter:drop-shadow(0 0 4px #f5eabc);outline:0;box-shadow:none}
.atlas-map .territory.battle-target{stroke:#f34942;stroke-width:4;fill-opacity:.85;animation:territory-target 1s ease-in-out infinite}
.atlas-map .territory.captured{stroke:#ffef95;stroke-width:5;fill-opacity:.9;animation:territory-capture 1.1s ease-out;outline:0;box-shadow:none}
.national-border{stroke:#4f5f59;stroke-width:2.6;stroke-linejoin:round;pointer-events:none}
.atlas-name{font-family:"Malgun Gothic",sans-serif;font-size:15px;font-weight:600;fill:#303e3b;paint-order:stroke;stroke:#f5e8c788;stroke-width:2;stroke-linejoin:round}
.atlas-river{fill:none;stroke:#6caaa0;stroke-width:5;stroke-linecap:round;opacity:.7;paint-order:stroke}
.sea-label{fill:#456e74;opacity:.58;font-family:Georgia,"Malgun Gothic",serif;font-size:23px;letter-spacing:7px}
.map-compass text{font-family:Georgia,serif;font-size:17px}
.map-country-token{display:flex;align-items:center;gap:7px;padding:5px 6px;width:132px;height:57px;background:#111d2bef;border:1.5px solid color-mix(in srgb,var(--nation) 75%,white);border-radius:5px;box-shadow:0 3px 8px #153b5188;text-align:left;line-height:1.2}
.map-country-token:hover,.map-country-token.focused{outline:2px solid #f1dda1;outline-offset:1px}
.map-country-token.attacking{box-shadow:0 0 14px #ff624d99}
.token-portraits{display:flex;align-items:flex-end;position:relative;width:43px;flex:0 0 43px;height:43px}
.token-portraits img{width:28px;height:42px;object-fit:cover;object-position:center 20%;border-radius:3px;border:1px solid #6d7992}
.token-portraits img+img{height:31px;width:22px;margin-left:-7px;z-index:1;border-color:#d7bc74}
.token-copy{min-width:0;display:block}
.token-copy>b{font-size:11px;display:block;color:#d8e3ed;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70px}
.token-copy>strong{font-size:23px;font-weight:700;color:#f4e9ce;display:block;letter-spacing:-.8px;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1}
.token-copy small{font-size:9px;color:#a9b7cb;margin-left:3px;font-weight:400;letter-spacing:0}
.army-delta{position:absolute;top:58px;left:26px;font-size:18px;font-weight:750;padding:2px 7px;border-radius:5px;border:1px solid currentColor;background:#101a2eea;line-height:1.2;white-space:nowrap;animation:army-delta-rise 1.2s ease-out both}
.army-delta.positive{color:#b3edb1}.army-delta.negative{color:#ffae93}
.token-wrap{position:relative;height:80px}
.campaign-route{stroke-width:5;stroke-linecap:round;stroke-dasharray:12 8;animation:route-flow 1s linear infinite;filter:drop-shadow(0 1px 2px #233e5480)}
.campaign-route.defense{stroke-width:4;stroke-dasharray:7 9}
.target-ring{fill:#f06c3433;stroke:#fff1c2;stroke-width:3;animation:target-breath 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.clash-mark{fill:#60392d;font-size:30px;paint-order:stroke;stroke:#fff7da;stroke-width:3}
.atlas-map-note{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 17px;color:#9ba996;background:#1a2019;font-size:8px;border-top:1px solid #374132}
.atlas-map-note>span:first-child{display:flex;align-items:center;gap:5px}
.visual-layout{grid-template-columns:minmax(0,1.55fr) minmax(330px,.95fr);gap:20px;align-items:start}
.visual-map-column{min-width:0}
.simulation-page .panel{background:#1a2230;border-color:#344052}
.simulation-page .panel-head{padding:17px 19px}
.simulation-page .panel-head h2{font-size:16px}
.simulation-page .eyebrow{color:#9eafc3}
.simulation-page .tiny-badge{color:#a1b7cc;background:#263649;border-color:#3f536c}
.simulation-page .map-view-select{color:#9caec1}
.simulation-page .map-view-select select{color:#c4d0df;background:#182331;border-color:#46556b}
.simulation-page .atlas-map-note{background:#192331;color:#8e9caf;border-color:#354253}
.simulation-page .map-legend{background:#1c2736;gap:11px;padding:11px 16px}

.simulation-page .simulation-controls{background:linear-gradient(110deg,#202a3c,#182231);border-color:#3b4a62}
.simulation-page .simulation-meta{border-left-color:#465371}
.simulation-page .simulation-meta b{color:#e2e5ed}
.simulation-page .simulation-meta span,.simulation-page .speed-label{color:#97a8bd}
.simulation-page .speed-label select,.simulation-page .run-settings input{background:#131e2f;border-color:#3e4c64;color:#c2cddd}
.simulation-page .round-display>span,.simulation-page .round-display small{color:#95a6bc}
.simulation-page .run-settings{color:#8d9cb2}
.simulation-page .simulation-notice{background:#1d2835;border-color:#34465b;color:#a7b9ca}
.simulation-page .notice>svg{color:#c7b47f}
.simulation-page .history-panel .panel-head{border-color:#354255}
.simulation-page .history-entry{border-color:#303e50}
.simulation-page .history-time b{color:#b7c2d3}.simulation-page .history-time small{color:#8495ac}
.simulation-page .history-content>p{color:#a3b1c5}
.simulation-page .roll-pills>span{background:#142033;border-color:#384862;color:#adbbce}
.simulation-page .event-icon{background:#263b40;border-color:#3d5659;color:#a0cfb9}
.simulation-page .event-icon.war{background:#44302f;border-color:#67413b;color:#e5a084}
.simulation-page .pending-entry{background:linear-gradient(90deg,#273246,#1b2637)}
.visual-nations{display:grid;grid-template-columns:repeat(auto-fit,minmax(79px,1fr));gap:7px;margin:13px 0}
.visual-nation-card{border:1px solid #354358;background:#1b2636;padding:10px 8px;text-align:left;min-width:0;transition:border .2s,background .2s}
.visual-nation-card:hover,.visual-nation-card.active{border-color:var(--nation);background:color-mix(in srgb,var(--nation) 10%,#192538)}
.visual-nation-card>span{font-size:10px;font-weight:650;display:flex;align-items:center;gap:5px;color:#d8e1eb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visual-nation-card i{width:5px;height:5px;border-radius:50%;background:var(--nation);flex-shrink:0}
.visual-nation-card>div{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:7px}
.visual-nation-card strong{font-size:19px;font-weight:650;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.visual-nation-card small{font-size:7px;color:#9fadc1;display:block;margin-top:3px;letter-spacing:0;font-weight:400}
.visual-nation-card.eliminated{opacity:.4;filter:grayscale(.7)}
.visual-commanders .panel-head{border-bottom:1px solid #344255;gap:15px}
.visual-commanders .panel-head h2{font-size:12px;color:var(--nation)}
.visual-commanders .panel-head>span{font-size:8px;color:#98a7be;text-align:right}
.commander-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:8px;padding:13px}
.commander-mini{display:flex;align-items:center;gap:8px;background:#141e2d;padding:6px;border:1px solid #364357;text-align:left;min-width:0}
.commander-mini:hover{border-color:#d7b77b}
.commander-mini>img{width:33px;height:44px;object-fit:cover;object-position:center 20%;border-radius:3px}
.commander-mini b{font-size:11px;display:block;max-width:85px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.commander-mini small{font-size:8px;color:#9daac0;display:block;margin-top:2px}
.commander-strip>p{font-size:11px;color:#9baac0;padding:5px}
.arena-panel{padding:19px 21px 17px;background:radial-gradient(ellipse at 55% 20%,#2b364c,#192231 75%)!important;position:sticky;top:20px;min-width:0;box-shadow:0 8px 32px #050c171a}
.arena-top{display:flex;align-items:center;justify-content:space-between;font-size:8px;letter-spacing:.7px;color:#8598b3;padding-bottom:16px}
.arena-nation{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:0;color:var(--nation);font-weight:600}
.arena-nation i{width:6px;height:6px;border-radius:50%;background:var(--nation)}
.scene-progress{list-style:none;display:flex;gap:5px;margin:0 0 23px;padding:0}
.scene-progress li{flex:1;border-top:3px solid #354157;padding-top:6px;color:#64748e;font-size:8px;text-align:center}
.scene-progress li.current{border-top-color:#ddc384;color:#eadcbb}.scene-progress li.complete{border-top-color:#6a8d9b;color:#9db8bf}
.arena-heading{margin-bottom:18px;min-height:107px}
.arena-heading .eyebrow{font-size:8px;letter-spacing:1.6px;color:#d7bd80}
.arena-heading h2{font-size:21px;font-weight:650;line-height:1.5;color:#e9edf5;margin:7px 0;letter-spacing:-.6px;overflow-wrap:anywhere}
.arena-heading p{font-size:11px;color:#a1b0c4;line-height:1.9;word-break:keep-all}
.single-judgment{display:flex;align-items:center;justify-content:center;gap:30px;padding:5px 0 20px;min-height:236px}
.scene-portrait{margin:0;width:109px;flex:0 0 109px;border:1px solid color-mix(in srgb,var(--nation) 70%,#344057);border-radius:7px;background:#101b2b;overflow:hidden;text-align:center;box-shadow:0 4px 12px #050c1933}
.scene-portrait>img{width:100%;height:144px;display:block;object-fit:cover;object-position:center 20%}
.scene-portrait figcaption{padding:7px 5px 8px}
.scene-portrait figcaption small{display:block;font-size:9px;color:var(--nation)}
.scene-portrait figcaption strong{display:block;font-size:14px;color:#e6edf6;line-height:1.5;overflow-wrap:anywhere}
.scene-portrait figcaption span{display:block;font-size:8px;color:#8ea0bc}
.visual-die-block{text-align:center;min-width:0;max-width:155px}
.die-caption{color:#a6b2c6;font-size:10px;display:block;margin-bottom:9px;min-height:16px}
.visual-die{width:99px;height:118px;margin:auto;display:flex;align-items:center;justify-content:center;position:relative;flex-direction:column;border:1px solid #6c6a64;border-radius:15px;background:radial-gradient(ellipse at 25% 20%,#494a4b,#252c38 65%,#192333);color:#f5e7c1;box-shadow:inset 0 1px 2px #f5e7c122,0 6px 16px #02091466;transform-style:preserve-3d;perspective:500px}
.visual-die .die-number{font-family:Georgia,serif;font-size:61px;font-weight:400;line-height:1.15;color:#f4e5ba;text-shadow:0 2px 10px #e3ca7a30}
.visual-die>small{font-size:8px;color:#a0a5ad;letter-spacing:1.5px;display:block;margin-top:2px}
.die-corner{position:absolute;width:8px;height:8px;border-color:#a4997b;opacity:.5}
.die-corner.top{top:9px;left:9px;border-top:1px solid;border-left:1px solid}
.die-corner.bottom{bottom:9px;right:9px;border-bottom:1px solid;border-right:1px solid}
.visual-die.rolling{animation:studio-die-roll .48s ease-in-out infinite}
.visual-die.rolling .die-number{visibility:hidden}
.rolling-number{position:absolute;top:16px;left:0;right:0;font-family:Georgia,serif;font-size:61px;line-height:1.15;color:#f3e5bd}
.rolling-number::after{content:'4';animation:studio-die-faces .55s steps(1) infinite}
.visual-die.locked{border-color:#dbbc74;box-shadow:0 0 24px #e6ba6230,inset 0 0 18px #cfa55510;animation:studio-die-lock .4s ease-out}
.die-equation{height:43px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:19px;margin-top:11px;color:#adb8cc;white-space:nowrap;font-variant-numeric:tabular-nums}
.die-equation>b{color:#93d8b2;font-weight:600}
.die-equation>strong{font-size:30px;color:#f0d898;line-height:1;animation:score-reveal .35s ease-out}
.waiting-equation{font-size:8px;color:#7d90ae}
.character-description{background:#111c2cc2;border:1px solid #41506a;border-radius:8px;padding:14px 15px;margin-top:1px}
.character-description>strong{font-size:14px;color:#ddc385;display:block}
.character-description>strong>span{font-size:9px;color:#a4b1c5;font-weight:400;margin-left:8px}
.character-description>p{font-size:11px;color:#d0d8e7;line-height:1.8;margin:5px 0 10px}
.trait-chips{display:flex;flex-wrap:wrap;gap:5px}
.trait-chips>b{background:#2e3c51;border:1px solid #46566d;border-radius:4px;color:#c6d2e3;font-size:9px;padding:2px 6px;font-weight:500}
.visual-duel{display:flex;align-items:flex-start;justify-content:center;gap:7px;padding:0 0 8px;min-width:0}
.duel-side{flex:1;min-width:0;text-align:center;max-width:174px}
.duel-side-label{font-size:11px;color:#f19689;font-weight:600;padding-bottom:12px}
.defender .duel-side-label{color:#95baff}
.duel-side-label>span{display:block;font-size:9px;font-weight:400;color:#a3b1c5;margin-top:3px}
.scene-portrait.compact{width:83px;min-width:0;margin:0 auto 14px}
.scene-portrait.compact>img{height:106px}
.scene-portrait.compact figcaption{padding:5px 4px}
.scene-portrait.compact figcaption strong{font-size:12px}
.scene-portrait.compact figcaption small{font-size:8px}
.scene-portrait.compact figcaption span{font-size:7px}
.duel-vs{width:25px;flex:0 0 25px;display:flex;align-items:center;flex-direction:column;gap:8px;margin-top:82px;color:#ddc183}
.duel-vs>span{font-family:Georgia,serif;font-size:18px;font-style:italic}
.duel-vs>svg{color:#a8a9ae}
.duel-side .visual-die-block{max-width:none}
.duel-side .visual-die{width:81px;height:94px;border-radius:12px}
.duel-side .visual-die .die-number,.duel-side .rolling-number{font-size:47px}
.duel-side .rolling-number{top:13px}
.duel-side .die-caption{font-size:9px;margin-bottom:7px}
.duel-side .die-equation{font-size:15px;gap:4px;height:40px;margin-top:7px}
.duel-side .die-equation strong{font-size:29px}
.duel-side .waiting-equation{font-size:7px}
.side-modifiers{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:3px}
.side-modifiers>span{font-size:8px;padding:2px 4px;border:1px solid #425169;border-radius:3px;color:#b0bfd6;background:#26354a}
.battle-comparison{display:flex;align-items:center;gap:7px;margin:16px 0 6px}
.battle-comparison>span{font-size:8px;color:var(--nation);max-width:65px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.army-comparison-bar{height:5px;flex:1;background:#334159;border-radius:5px;display:flex;overflow:hidden}
.battle-losses{display:grid;grid-template-columns:1fr 1fr;border:1px solid #554748;background:#241e28aa;border-radius:7px;padding:11px;margin:15px 0;gap:9px;text-align:center}
.battle-losses>div+div{border-left:1px solid #584647}
.battle-losses small{font-size:8px;color:#bba3a5}
.battle-losses strong{font-size:26px;display:block;color:#efaa92;line-height:1.25}
.battle-losses strong>span{font-size:10px;margin-left:4px;font-weight:400}
.battle-losses p{font-size:9px;color:#a5a8b6;margin-top:3px}
.scene-result{display:flex;align-items:center;justify-content:center;gap:7px;background:#244037;border:1px solid #4c7663;color:#b8e3c5;border-radius:7px;padding:11px;font-size:12px;line-height:1.6;margin-top:16px;animation:score-reveal .4s ease-out;text-align:center}
.scene-result.failure{background:#3a2e33;border-color:#735158;color:#e4b5b0}
.scene-status{display:flex;align-items:center;gap:7px;border:1px solid #35445a;background:#111c2a77;border-radius:6px;padding:10px 12px;font-size:9px;color:#9dacbf;margin-top:18px;line-height:1.7}
.live-indicator{display:inline-block;width:5px;height:5px;border-radius:50%;background:#8fa8c3;flex:0 0 5px}
.live-indicator.pulsing{background:#9ed0ad;animation:live-pulse 1.2s ease-in-out infinite}
.arena-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #36445b;margin-top:17px;padding-top:14px}
.arena-controls .button{font-size:10px}
.arena-controls .button.outline{background:#29364b;border-color:#465671;color:#d4dbea}
.arena-controls .button.subtle{color:#a4b5cb}
.neutral-target{height:176px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#9aacb3}
.neutral-target>b{font-size:11px}
.automatic-label{font-size:9px;color:#9fafc4;margin:12px 0}
.automatic-banner{font-size:11px;color:#d7c68f;display:flex;align-items:center;justify-content:center;gap:8px;background:#423c2866;border:1px solid #716343;padding:11px;border-radius:6px}
.scene-production{background:#2f372777;border:1px solid #586647;border-radius:6px;padding:10px 12px;margin-top:12px}
.scene-production b{font-size:9px;color:#c4d2a9;display:block}
.scene-production>span{font-size:8px;line-height:1.9;color:#9eac8a;display:block;margin-top:4px}
.fall-announcement{display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid #b99a64;border-radius:7px;margin-top:12px;padding:13px;font-size:17px;font-weight:650;color:#f0d29b;background:radial-gradient(ellipse,#5a4829,#2b2730);animation:score-reveal .5s ease-out}
@keyframes studio-die-roll{0%,100%{transform:perspective(400px) rotateX(12deg) rotateY(-18deg) rotate(-8deg) translateY(0)}25%{transform:perspective(400px) rotateX(-18deg) rotateY(25deg) rotate(9deg) translateY(-5px)}50%{transform:perspective(400px) rotateX(23deg) rotateY(-22deg) rotate(-11deg) translateY(1px)}75%{transform:perspective(400px) rotateX(-8deg) rotateY(15deg) rotate(7deg) translateY(-3px)}}
@keyframes studio-die-faces{0%{content:var(--face-1)}15%{content:var(--face-2)}30%{content:var(--face-3)}45%{content:var(--face-4)}60%{content:var(--face-5)}75%{content:var(--face-6)}90%{content:var(--face-7)}}
@keyframes studio-die-lock{0%{transform:scale(1.13);filter:brightness(1.6)}65%{transform:scale(.97)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes route-flow{to{stroke-dashoffset:-40}}
@keyframes territory-target{50%{stroke:#ffe68b;fill-opacity:1}}
@keyframes territory-capture{0%{filter:brightness(1.7)}100%{filter:brightness(1)}}
@keyframes target-breath{50%{transform:scale(1.18);opacity:.6}}
@keyframes army-delta-rise{0%{transform:translateY(12px);opacity:0}30%,100%{transform:translateY(0);opacity:1}}
@keyframes score-reveal{0%{transform:translateY(7px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes live-pulse{50%{opacity:.3;box-shadow:0 0 8px #a6d9b1}}
.recording-mode #main-content{max-width:none;height:100vh;padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.recording-mode .workspace{height:100vh;overflow:hidden}
.recording-mode .page-heading{margin:0;flex:0 0 auto}
.recording-mode .page-heading h1{margin:0;font-size:20px}
.recording-mode .simulation-controls{padding:12px 18px;flex:0 0 auto}
.recording-mode .simulation-layout.visual-layout{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 410px;gap:18px;margin:0;align-items:stretch}
.recording-mode .visual-map-column{display:flex;flex-direction:column;min-height:0}
.recording-mode .atlas-panel{flex:1;min-height:0;display:flex;flex-direction:column}
.recording-mode .atlas-scroll{flex:1;min-height:0;overflow:hidden;display:flex;align-items:stretch}
.recording-mode .atlas-map{width:100%;height:100%;min-width:0;aspect-ratio:auto}
.recording-mode .atlas-panel .panel-head{flex:0 0 auto;padding:12px 18px}
.recording-mode .atlas-panel .map-legend{padding:8px 16px;flex:0 0 auto}
.recording-mode .atlas-map-note{display:none}
.recording-mode .visual-commanders{display:none}
.recording-mode .visual-nations{margin:10px 0 0;flex:0 0 auto}

function defaultPortraitKey(countryId, role = 'king') {
  const preset = /^nation-(\d)$/.exec(countryId || '');
  const legacyMapping = [0, 1, 2, 3, 0, 3, 1];
  let index = preset && legacyMapping[Number(preset[1])];
  if (!Number.isInteger(index)) {
    let hash = 0; for (const char of String(countryId || 'unassigned')) hash = (Math.imul(hash, 31) + char.charCodeAt(0)) >>> 0;
    index = hash % 4;
  }
  return `n${index}-${role}`;
}
function portraitSource(person, country, role = 'king') {
  return BUILTIN_PORTRAITS[person?.portraitKey] || BUILTIN_PORTRAITS[defaultPortraitKey(country?.id, person?.role || role)];
}
function portraitImage(person, country, role = 'king', className = '') {
  const label = person?.name || (role === 'king' ? '국왕 미배치' : role === 'minister' ? '승상 미배치' : '장군 미배치');
  return `<img class="${className}" src="${portraitSource(person, country, role)}" alt="${esc(label)}" width="120" height="156" decoding="async">`;
}
const portraitLabel = key => `${['청람','적연','금휘','백록'][Number(key[1])]} ${key.endsWith('king')?'국왕':key.endsWith('minister')?'승상':'장군'}`;
const portraitChoices = () => Object.keys(BUILTIN_PORTRAITS);


// src/ui/map-geometry.js
// Shared edges keep the exact cardinal adjacency of the editable grid.
// This only draws the world; it never generates territory ownership or changes game rules.
const ATLAS_WIDTH = 1200;
const ATLAS_HEIGHT = 800;
function visualHash(a, b, salt = 0) {
  const value = Math.imul(a + 37, 374761393) ^ Math.imul(b + 91, 668265263) ^ Math.imul(salt + 1, 1274126177);
  return ((Math.imul(value ^ (value >>> 13), 1274126177) ^ (value >>> 16)) >>> 0) / 4294967296;
}
const pairKey = (a, b) => a < b ? `${a}:${b}` : `${b}:${a}`;
function buildMapGeometry(rows, cols) {
  const points = [], mids = new Map();
  for (let row = 0; row <= rows; row++) for (let col = 0; col <= cols; col++) {
    const u = col / cols, v = row / rows;
    const extent = 1000 - 155 * Math.cos((v - 0.48) * Math.PI * 1.7);
    const x = 600 + (u - .5) * extent + 45 * Math.sin(v * 5.5) + (visualHash(row, col, 1) - .5) * (780 / cols) * .28;
    const y = 410 + (v - .5) * 555 + 30 * Math.sin(u * 7.2 + .8) + (visualHash(row, col, 2) - .5) * (500 / rows) * .3;
    points.push([Number(x.toFixed(2)), Number(y.toFixed(2))]);
  }
  const vertex = (r, c) => r * (cols + 1) + c;
  function middle(a, b) {
    const key = pairKey(a, b); if (mids.has(key)) return mids.get(key);
    const [x1, y1] = points[a], [x2, y2] = points[b];
    const bend = (visualHash(Math.min(a,b), Math.max(a,b), 3) - .5) * .22;
    const result = [Number(((x1 + x2) / 2 - (y2 - y1) * bend).toFixed(2)), Number(((y1 + y2) / 2 + (x2 - x1) * bend).toFixed(2))];
    mids.set(key, result); return result;
  }
  function path(ids, closed = true) {
    const coords = [points[ids[0]]];
    for (let i = 1; i < ids.length; i++) coords.push(middle(ids[i - 1], ids[i]), points[ids[i]]);
    if (closed) coords.push(middle(ids.at(-1), ids[0]));
    return 'M' + coords.map(p => p.join(',')).join(' L') + (closed ? ' Z' : '');
  }
  const cells = [];
  for (let row = 0; row < rows; row++) for (let col = 0; col < cols; col++) {
    const vertices = [vertex(row,col),vertex(row,col+1),vertex(row+1,col+1),vertex(row+1,col)];
    const center = [0,1].map(axis => Number((vertices.reduce((sum, i) => sum + points[i][axis], 0) / 4).toFixed(2)));
    cells.push({ row, col, center, vertices, path: path(vertices) });
  }
  const coast = [];
  for (let c=0;c<=cols;c++) coast.push(vertex(0,c));
  for (let r=1;r<=rows;r++) coast.push(vertex(r,cols));
  for (let c=cols-1;c>=0;c--) coast.push(vertex(rows,c));
  for (let r=rows-1;r>0;r--) coast.push(vertex(r,0));
  return { width: ATLAS_WIDTH, height: ATLAS_HEIGHT, cells, coastPath: path(coast), edgePath: (a,b) => path([a,b],false) };
}

const geometryCache = new Map();
const geometryFor = world => { if(world.mapKind==='v11')return V11_ATLAS; const key=`${world.rows}:${world.cols}`;if(!geometryCache.has(key))geometryCache.set(key,buildMapGeometry(world.rows,world.cols));return geometryCache.get(key); };
function countryMarkers(world,geometry=geometryFor(world)) {
  return world.countries.flatMap(country=>{
    const own=world.territories.filter(t=>t.ownerId===country.id);if(!own.length)return [];
    const territory=own.find(t=>t.id===country.capitalId)||own[0];
    return [{country,territory,point:geometry.cells[territory.row*world.cols+territory.col].center}];
  });
}
function unitMarkers(world,geometry=geometryFor(world)) {
  const units=countryMarkers(world,geometry).map(m=>({...m,person:countryPeople(world,m.country.id).find(p=>p.role==='king'),role:'king',troops:m.country.reserve??Math.min(5,m.country.troops)}));
  for(const person of world.people.filter(p=>p.role==='general'&&p.active&&p.alive)) {
    const country=findCountry(world,person.countryId),territory=world.territories.find(t=>t.id===person.stationId&&t.ownerId===country?.id);if(!territory)continue;
    units.push({country,territory,person,role:'general',troops:person.troops,point:geometry.cells[territory.row*world.cols+territory.col].center});

// A presentation-only scale. Values above the die's maximum keep the deepest red.
function diceColor(value,sides=10) {
  const amount=Number.isFinite(value)&&sides>1?Math.min(1,Math.max(0,(value-1)/(sides-1))):0;
  const start=[244,229,186],end=[255,65,57];
  return `rgb(${start.map((channel,i)=>Math.round(channel+(end[i]-channel)*amount)).join(', ')})`;
}
function diceReel(sides=10) {
  return [4,7,2,9,1,6,3].map((face,i)=>{
    const value=1+(face-1)%sides;
    return `--face-${i+1}:'${value}';--face-color-${i+1}:${diceColor(value,sides)}`;
  }).join(';');
}

function makeTurnScenes(record,before) {
  const scenes=[];

    const frame=record.frames?.[event.index]||{before,after:before};
    const roll=record.rolls[event.rollIndex];
    const attempts=event.type==='king'?(roll?.attempts||[]):roll?[roll.value]:[];
    if(attempts.length) attempts.forEach((value,attempt)=>scenes.push({
      id:`${event.type}-${event.index}-${attempt}`,kind:'roll',role:event.role,event,
      battleIndex:event.battleIndex,diceIndices:[event.rollIndex],value,faces:roll.sides,
      title:attempt<attempts.length-1?'전쟁 대상 없음 · 국왕 주사위 다시 굴림':event.type==='king'?'국왕의 행동 선택':event.type==='minister'?'승상의 내정 선택':event.type==='war_target'?'공격 국가 선택':event.title,
      lockedTitle:attempt<attempts.length-1?'공격 가능한 국가가 없어 재판정':event.title,
      detail:event.detail,worldBefore:frame.before,worldAfter:frame.before,

    }));

    if(event.type==='resolve')scenes.push({id:`apply-${event.index}`,kind:'apply',event,battleIndex:event.battleIndex,title:'병력과 영토에 결과 반영',detail:event.detail,worldBefore:frame.before,worldAfter:frame.after});

}

    this.clearTimer();this.groupEnd=null;this.groupDone=false;const scenes=makeTurnScenes(record,before);scenes.at(-1).worldAfter=after;

  }
  arm(){if(!this.state?.playing||this.state.finished)return;this.clearTimer();this.scheduledSpeed=Math.max(.1,Number(this.speed())||1);this.deadline=this.now()+this.remaining/this.scheduledSpeed;this.handle=this.schedule(()=>{this.handle=null;this.advance();},this.remaining/this.scheduledSpeed);}
  pause(){if(!this.state||!this.playing)return;if(this.handle!==null)this.remaining=Math.max(0,(this.deadline-this.now())*this.scheduledSpeed);this.clearTimer();this.state.playing=false;}
  resume(){if(!this.state||this.state.finished)return;this.groupEnd=null;this.groupDone=false;this.state.playing=true;this.onChange();this.arm();}
  advance(){
    if(!this.state||this.state.finished)return;this.clearTimer();
    if(this.state.phase==='rolling')this.state.phase=this.scene.bonus?'raw':'locked';
    else if(this.state.phase==='raw')this.state.phase='merging';

    else if(this.groupEnd===this.state.index&&this.state.index<this.state.scenes.length-1){this.state.playing=false;this.groupDone=true;this.onChange();return;}
    else if(this.state.index<this.state.scenes.length-1){this.state.index++;this.state.phase=this.scene.kind==='roll'?'rolling':'holding';}
    else{this.state.finished=true;this.state.playing=false;this.onChange();this.onFinish();return;}
    this.remaining=this.duration();this.onChange();if(this.state.playing)this.arm();
  }
  playGroup(){
    if(!this.state||this.state.finished)return;

}

document.addEventListener('click', event => {

  if (action) { if (action.disabled) return; try { actions[action.dataset.action]?.(action.dataset.id); } catch (error) { notify(error.message, true); } return; }
  const tile = event.target.closest('[data-territory]');
  if (tile) {
    if (tile.dataset.observe) { const t = run?.world.territories.find(t => t.id === tile.dataset.territory); const c = findCountry(run?.world || world, t?.ownerId); notify(`${t?.name} · ${c?.name || '무주지'}`); return; }
    ui.selected = tile.dataset.territory;
    if (ui.page === 'map' && ui.paint) { const next = clone(world); next.territories.find(t => t.id === ui.selected).ownerId = ui.brush || null; updateWorld(next); }
    else render();
  }
});
document.addEventListener('submit', event => {
  event.preventDefault();
  const form = event.target, data = new FormData(form);
  try {
    if (form.id === 'dialog-form') { dialogHandler?.(data); $('#editor-dialog').close(); dialogHandler = null; }
    else if (form.id === 'territory-form') {
      const next = clone(world), t = next.territories.find(t => t.id === ui.selected);
      if (!t) throw new Error('수정할 영토를 선택해 주세요.');
      t.name = data.get('name'); t.ownerId = data.get('ownerId') || null; updateWorld(next); notify('영토 정보를 저장했습니다.');
    } else if (form.id === 'rules-form') {
      const next = clone(world), r = next.rules;
      for (const k of ['successTarget', 'recruitGain', 'productionGain', 'territoryProduction', 'armyAdvantageBonus', 'roundLimit', 'supplyGain', 'baseCapacity', 'minimumReserve']) r[k] = Number(data.get(k));
      r.diceSides=10;for(const k of Object.keys(MINISTER_STYLES))r.ministerWeights[k]=[0,1,2].map(i=>Number(data.get(`weight-${k}-${i}`)));
      for (const k of Object.keys(PERSONALITIES)) r.domesticThresholds[k] = Number(data.get(`threshold-${k}`));
      for (const k of ['win', 'tie', 'loss']) r.lossRates[k] = Number(data.get(`loss-${k}`)) / 100;
      updateWorld(next); notify('규칙을 저장했습니다. 새 실행부터 적용됩니다.');
    }
  } catch (error) {
    if (form.id === 'dialog-form') { $('#dialog-error').hidden = false; $('#dialog-error').textContent = error.message; }
    else notify(error.message, true);
  }
});
document.addEventListener('change', async event => {
  const target = event.target;
  if (target.id === 'world-file') {
    const file = target.files?.[0]; target.value = '';
    if (!file) return;
    try {
      if (file.size > 5 * 1024 * 1024) throw new Error('세계 파일은 5MB 이하여야 합니다.');
      const next = parseWorld(await file.text());
      if (confirm(`‘${next.name}’ 세계를 불러올까요? 현재 세계와 실행 기록이 교체됩니다. 보관하려면 취소하고 먼저 파일로 내보내 주세요.`)) { setNewWorld(next); notify('세계의 국가·인물·영토·규칙을 모두 불러왔습니다.'); }
    } catch (error) { notify(error.message, true); }
  } else if(target.name==='countryId'&&target.closest('#editor-dialog')){const field=$('#editor-dialog [name="slot"]');if(field){const used=new Set(world.people.filter(p=>p.id!==editingPersonId&&p.role==='general'&&p.countryId===target.value).map(p=>p.slot));let slot=0;while(used.has(slot))slot++;field.value=slot+1;}}
  else if (target.id === 'show-names') { ui.showNames = target.checked; render(); }
  else if (target.id === 'paint-owner') ui.brush = target.value;
  else if (target.id === 'person-country-filter') { ui.countryFilter = target.value; render(); }
  else if (target.id === 'person-role-filter') { ui.roleFilter = target.value; render(); }
  else if (target.id === 'map-style') { ui.mapStyle=target.value; render(); }
  else if (target.id === 'sim-speed') { const wasAuto=auto, wasPlaying=playback.playing; stop(); ui.speed=Number(target.value); if(wasAuto)startAuto();else if(wasPlaying)playback.resume();else render(); }
  else if (target.id === 'sim-seed') ui.seed = target.value;
});
document.addEventListener('input', event => {
  if (event.target.id === 'sim-seed') ui.seed = event.target.value;
  if (event.target.id === 'person-search') {
    const start = event.target.selectionStart, end = event.target.selectionEnd;
    ui.search = event.target.value; render(); const field = $('#person-search'); field.focus(); field.setSelectionRange(start, end);
  }
  if (event.target.name === 'color') event.target.nextElementSibling.textContent = event.target.value.toUpperCase();
  if (event.target.name === 'diceSides' && event.target.closest('#rules-form')) {
    const sides = Number(event.target.value);
    if (sides >= 2 && sides <= 100) {
      for (const field of document.querySelectorAll('[name^="threshold-"]')) field.max = sides;
      document.querySelector('[name="successTarget"]').max = sides + 5;
    }
  }
});
document.addEventListener('fullscreenchange',()=>{
  if(document.fullscreenElement===$('#app')){nativeMapFullscreen=true;if(!ui.mapFullscreen)document.exitFullscreen().catch(()=>{});}
  else if(nativeMapFullscreen){nativeMapFullscreen=false;if(ui.mapFullscreen){ui.mapFullscreen=false;render();}}
});
document.addEventListener('visibilitychange', () => { if (document.hidden && (auto || playback.playing)) { stop(); render(); } });
document.addEventListener('keydown', event => { if((event.key==='Enter'||event.key===' ') && event.target.matches('.atlas-cell')) { event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return; } if(ui.page==='simulation'&&!event.target.closest('input,select,textarea,button,dialog')&&(event.code==='Space'||event.code==='Enter')){event.preventDefault();try{actions[event.code==='Space'?'scene-step':'step']();}catch(error){notify(error.message,true);}return;} if(event.key==='Escape'&&ui.mapFullscreen){closeMapFullscreen();return;} if (event.key === 'Escape' && ui.recording) { ui.recording = false; render(); } });
window.addEventListener('beforeunload', event => { if (playback.state&&!playback.complete) { event.preventDefault(); event.returnValue = ''; } });
$('#editor-dialog').addEventListener('click', event => { if (event.target === $('#editor-dialog')) { $('#editor-dialog').close(); dialogHandler = null; } });
try { const saved=loadRun(localStorage);if(saved&&saved.initialWorld.id===world.id){run=saved;ui.seed=saved.seed;} } catch(error){initialError ||= error.message;}
if (!initialError) persist();
render();
if (initialError) notify(initialError, true);

})();</script>
</body>
</html>
