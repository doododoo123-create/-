<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v57 전술 검증 · 게임 저장 아님</title><link rel="stylesheet" href="../src/ui/fonts-licensed.css"><link rel="stylesheet" href="../src/ui/mass-battle.css"><link rel="stylesheet" href="../src/ui/battle-theme.css"><style>body{margin:0;padding:12px;background:#102025;color:white;font-family:"Studio Sans",sans-serif}#fixture-label{font-size:13px;margin-bottom:8px}.mass-battle{width:1200px;height:690px;max-width:calc(100vw - 40px)}.mass-battle button{color:white;background:#203a30;border:1px solid #b9a672;border-radius:3px;cursor:pointer}.mass-inline{height:690px}</style><div id="fixture-label">기존 기록의 표시 검증 · 실제 게임 규칙 변경 없음</div><div id="demo"></div><script type="module">
import{renderMassBattle}from'../src/ui/mass-battle-view.js';import{MassBattleAnimation}from'../src/ui/mass-battle-animation.js';import{massBattleAt,massGlobalTime}from'../src/ui/mass-battle-plan.js';
const id=new URLSearchParams(location.search).get('id')||'pressure',plan=await(await fetch('../.artifacts/v57/demos/'+id+'.json')).json();let t=0,playing=false,speed=1,last=0;const playback={scene:{massPlan:plan,massStart:0,massEnd:plan.duration},get sceneProgress(){return t/plan.duration},get playing(){return playing},get effectiveSpeed(){return speed},reducedMotion:()=>false};document.querySelector('#demo').innerHTML=renderMassBattle({playback,inline:true});const renderer=new MassBattleAnimation();renderer.start(document.querySelector('#demo'),playback);window.harness={plan,renderer,playback,seek(base){t=massGlobalTime(plan,base);renderer.last=null;renderer.tick()},sample(base){return massBattleAt(plan,massGlobalTime(plan,base))},play(value=true){playing=value;last=0},speed(value){speed=value},get time(){return t}};document.querySelector('[data-action=auto]').onclick=()=>playing=!playing;document.querySelector('[data-action=mass-skip]').onclick=()=>{t=plan.duration;renderer.tick()};let frames=[];function tick(now){if(last&&playing)t=Math.min(plan.duration,t+(now-last)*speed);if(last)frames.push(now-last);last=now;renderer.tick();requestAnimationFrame(tick);}window.rafFrames=frames;requestAnimationFrame(tick);window.ready=true;
